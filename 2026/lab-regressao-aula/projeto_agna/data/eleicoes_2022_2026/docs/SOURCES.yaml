sources:
  - id: tse_2022_secoes_snapshot
    name: "Resultados presidenciais de 2022, extratos por seção"
    provider: "Tribunal Superior Eleitoral"
    url: "https://dadosabertos.tse.jus.br/dataset/resultados-2022"
    access_method: "cópia local de extratos tratados de arquivos públicos do TSE"
    license: "Creative Commons Attribution, conforme metadados do portal"
    download_script: "projeto_agna/scripts/16_coletar_metadados_eleicoes.py (metadados)"
    preparation_script: "projeto_agna/scripts/17_preparar_dados_eleicoes.R"
    date_accessed: "2026-10-13"
    snapshot_prepared: "2026-10-05"
    files:
      - "raw/section_votes_2022_T1.parquet"
      - "raw/section_votes_2022_T2.parquet"
    notes: "Origem: electoralFraud/quality_reports/results/eleicao2026_t1/data. Script anterior preservado em docs/origem_06b_section_votes.R. Denominadores aparecem uma vez por seção. Cargo Presidente, turnos 1 e 2."
  - id: tse_2026_bu_snapshot
    name: "Resultados presidenciais de 2026, extrato de boletins de urna"
    provider: "Tribunal Superior Eleitoral"
    url: "https://dadosabertos.tse.jus.br/dataset/resultados-2026"
    access_method: "cópia local de extrato tratado de boletins da API pública de resultados"
    license: "Creative Commons Atribuição, conforme metadados do portal"
    download_script: "projeto_agna/scripts/16_coletar_metadados_eleicoes.py (metadados e conferência)"
    preparation_script: "projeto_agna/scripts/17_preparar_dados_eleicoes.R"
    date_accessed: "2026-10-13"
    snapshot_prepared: "2026-10-05"
    files:
      - "raw/section_votes_2026_T1_bu.parquet"
      - "raw/section_votes_2026_T1_bu_cobertura.csv"
    notes: "Cargo Presidente, turno 1. Antes dos complementos, faltam 3.935 votos válidos em 15 seções do Brasil. O recibo registra também 41 seções sem BU no exterior; a soma nacional de votos válidos após os complementos brasileiros confere com a divulgação oficial. A zona ZZ entra no laboratório."
  - id: tse_2026_json_oficial
    name: "Divulgação oficial presidencial de 2026 e listas de seções"
    provider: "Tribunal Superior Eleitoral"
    url: "https://resultados.tse.jus.br/oficial/ele2026/6257/dados/br/br-c0001-e006257-u.json"
    access_method: "API pública JSON, sem credenciais"
    license: "Dados públicos eleitorais do TSE, atribuídos ao TSE"
    download_script: "projeto_agna/scripts/16_coletar_metadados_eleicoes.py"
    date_accessed: "2026-10-13"
    notes: "URLs individuais, datas de acesso e hashes constam dos manifestos JSON de cada coleta em raw/. Totais nacionais conferem todos os candidatos. JSONs de Betim e Carapicuíba e listas de seções de MG/SP permitem completar duas zonas sem rateio."
